<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Трекер запроса</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0d1117;
            color: white;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .card {
            background: #161b22;
            border-radius: 12px;
            padding: 32px;
            width: 400px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #00e5a0;
            background: #0d1117;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            border-radius: 8px;
            border: none;
            background: #00e5a0;
            color: #0d1117;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        .steps { margin: 24px 0; }
        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            color: #888;
            transition: color 0.3s;
        }
        .step.active { color: #00e5a0; }
        .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #444;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .step.active .dot { background: #00e5a0; }
        .result {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #0d1117;
            border-radius: 8px;
            border: 2px solid #00e5a0;
            color: #00e5a0;
        }
    </style>
</head>
<body>
<div class="card">
    <input type="text" id="textInput" placeholder="Введите текст...">
    <button id="sendBtn" onclick="sendRequest()">Отправить запрос</button>

    <div class="steps">
        <div class="step" id="step1">
            <div class="dot"></div>
            <span>Запрос отправлен</span>
        </div>
        <div class="step" id="step2">
            <div class="dot"></div>
            <span>Сервер получил запрос</span>
        </div>
        <div class="step" id="step3">
            <div class="dot"></div>
            <span>Обработка данных</span>
        </div>
        <div class="step" id="step4">
            <div class="dot"></div>
            <span>Ответ получен</span>
        </div>
    </div>

    <div class="result" id="result"></div>
    <button id="speakBtn" onclick="speakResult()" style="display:none; width:100%; padding:12px; margin-top:12px; border-radius:8px; border:none; background:#1a2535; color:#00e5a0; font-size:15px; cursor:pointer; border: 1px solid #00e5a0;">
        🔊 Озвучить ответ
    </button>
</div>

<script>
    async function sendRequest() {
        const text = document.getElementById('textInput').value;
        if (!text) return;

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;

        // Сбрасываем
        for (let i = 1; i <= 4; i++) {
            document.getElementById('step' + i).classList.remove('active', 'loading');
        }
        document.getElementById('result').style.display = 'none';

        // Шаг 1 — сразу
        document.getElementById('step1').classList.add('active');

        // Шаг 2 — fetch отправляем
        await sleep(300);
        document.getElementById('step2').classList.add('active');

        // Шаг 3 — ждём ответ (мигает)
        document.getElementById('step3').classList.add('loading');

        // Реальный запрос
        let data;
        try {
            const response = await fetch('https://hakaton-mvp-production.up.railway.app/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            data = await response.json();
        } catch (e) {
            data = { result: 'Ошибка подключения к серверу' };
        }

        // Шаг 3 готов, шаг 4
        document.getElementById('step3').classList.remove('loading');
        document.getElementById('step3').classList.add('active');
        await sleep(200);
        document.getElementById('step4').classList.add('active');

        // Результат
        const result = document.getElementById('result');
        result.style.display = 'block';
        result.textContent = data.result || data.message || 'Нет ответа';

        btn.disabled = false;
        document.getElementById('speakBtn').style.display = 'block';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }
  function speakResult() {
    const text = document.getElementById('result').textContent;
    if (!text) return;

    // Останавливаем если уже читает
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ru-RU';
    utterance.rate = 0.9;  // чуть медленнее
    utterance.pitch = 1;

    window.speechSynthesis.speak(utterance);
}
</script>
</body>
</html>
