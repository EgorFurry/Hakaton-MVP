<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Страница не найдена</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .error-wrapper { max-width: 480px; padding: 40px; }
    .error-code {
      font-size: 8rem;
      font-weight: 900;
      color: #5EEAD4;
      line-height: 1;
      margin-bottom: 16px;
      opacity: 0.15;
    }
    .error-icon { font-size: 4rem; margin-bottom: 24px; }
    .error-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #F5F7FF;
    }
    .error-text {
      color: #A8B3CF;
      margin-bottom: 32px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="error-wrapper">
    <div class="error-code">404</div>
    <div class="error-icon">🔍</div>
    <h1 class="error-title">Страница не найдена</h1>
    <p class="error-text">
      Похоже, эта страница недоступна.<br>
      Но мы всё равно заботимся о вас!
    </p>
    <a href="index.html" class="primary-btn">← Вернуться домой</a>
  </div>
</body>
</html>
</html>
